name: Check skill

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Check skill metadata
        run: |
          grep -q '^name: sdlc$' skills/sdlc/SKILL.md
          grep -q '^description:' skills/sdlc/SKILL.md
      - name: Test bootstrap updater
        run: python3 -m unittest discover -s skills/sdlc/tests -v
